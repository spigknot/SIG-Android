plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def zigVersion = "0.16.0"
def zigArchiveName = "zig-x86_64-windows-${zigVersion}.zip"
def zigDownloadUrl = "https://ziglang.org/download/${zigVersion}/${zigArchiveName}"
def zigSha256 = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
def zigToolsDir = rootProject.file(".tools/zig-${zigVersion}")
def zigExecutable = new File(zigToolsDir, "zig.exe")
def buildNativeComponents = providers.gradleProperty("buildNativeComponents")
        .orNull?.toBoolean() ?: false

tasks.register("prepareZig") {
    group = "build setup"
    description = "Baixa e valida o Zig usado para compilar as ferramentas Vulkan no Windows."
    onlyIf { System.getProperty("os.name").toLowerCase().contains("windows") }
    outputs.file(zigExecutable)

    doLast {
        if (zigExecutable.isFile()) return

        def downloadsDir = rootProject.file(".tools/downloads")
        def archive = new File(downloadsDir, zigArchiveName)
        downloadsDir.mkdirs()

        if (!archive.isFile()) {
            logger.lifecycle("Baixando Zig ${zigVersion}...")
            new URI(zigDownloadUrl).toURL().withInputStream { input ->
                archive.withOutputStream { output -> output << input }
            }
        }

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        archive.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
        }
        def actualSha256 = digest.digest().encodeHex().toString()
        if (!actualSha256.equalsIgnoreCase(zigSha256)) {
            archive.delete()
            throw new GradleException("Checksum inválido no download do Zig: ${actualSha256}")
        }

        def extractionDir = rootProject.file(".tools/zig-extract-${zigVersion}")
        delete(extractionDir)
        copy {
            from zipTree(archive)
            into extractionDir
        }
        def extractedRoot = extractionDir.listFiles()?.find {
            it.isDirectory() && it.name.startsWith("zig-x86_64-windows-")
        }
        if (extractedRoot == null) {
            throw new GradleException("Estrutura inesperada no arquivo do Zig.")
        }
        delete(zigToolsDir)
        copy {
            from extractedRoot
            into zigToolsDir
        }
        delete(extractionDir)
        if (!zigExecutable.isFile()) {
            throw new GradleException("O executável do Zig não foi extraído corretamente.")
        }
    }
}

android {
    namespace 'br.gov.sp.pcsp.launcher'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "br.gov.sp.pcsp.launcher"
        minSdk 24
        targetSdk 35
        versionCode 37
        versionName "1.474"

        buildConfigField "boolean", "ENABLE_NPU_TESTS", "true"

        if (buildNativeComponents) {
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DSIG_ZIG_EXE=${zigExecutable.absolutePath.replace('\\', '/')}"
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // As libs nativas do ONNX Runtime (engine do Granite) NÃO vão no APK:
            // são baixadas do R2 no pacote v2 de dependências nativas (1ª execução).
            // Manter o APK < 10 MB.
            excludes += [
                "**/libonnxruntime.so",
                "**/libonnxruntime4j_jni.so",
            ]
        }
    }

    if (buildNativeComponents) {
        externalNativeBuild {
            cmake {
                path file("src/main/cpp/CMakeLists.txt")
                version "3.22.1"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.dependsOn("prepareZig")
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'  // ← Custom Tabs
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation("com.squareup.okhttp3:okhttp:4.10.0")
    // ONNX Runtime (engine do Granite Speech 5.0 TurboCTC local).
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.29.0")
    implementation files('libs/ffmpeg-kit-api.jar')
    // O FFmpegKitConfig.<clinit> referencia com.arthenica.smartexception.java.Exceptions —
    // obrigatória (já removida uma vez como "redundante" e quebrou TODAS as ferramentas ffmpeg).
    implementation("com.arthenica:smart-exception-java:0.2.1")
    testImplementation("junit:junit:4.13.2")
    testImplementation("com.squareup.okhttp3:mockwebserver:4.10.0")
    // org.json real no JVM dos testes unitários (o stub do Android não é mockado).
    testImplementation("org.json:json:20240303")

}
