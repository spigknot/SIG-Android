plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.gov.sp.pcsp.launcher'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "br.gov.sp.pcsp.launcher"
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName "1.414"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        buildConfigField "String", "IMEICHECK_API_KEY", "\"AC98-7B2E-E1DC-48A0-0F34-46VN\""
        buildConfigField "boolean", "ENABLE_NPU_TESTS", "true"
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'  // ← Custom Tabs
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation("com.squareup.okhttp3:okhttp:4.10.0")
    implementation("com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1")

}
