name: Verificar modelos no R2 (SHA-256 completo)

# Le os 4 objetos espelhados direto do R2 e confere o SHA-256 COMPLETO contra
# os pinos — leitura publica, nenhum byte passa pela rede local (runners do
# GitHub). Complementa o mirror-models-to-r2.yml (que baixa do HF e envia).
#
# Rode em: Actions -> "Verificar modelos no R2" -> Run workflow.

on:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar do R2 e conferir SHA-256 (completo)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://pub-6476622beda24c82875cb84f11f660ea.r2.dev"
          ok=0

          check() { # $1=url $2=sha256 esperado $3=nome
            echo "== $3 =="
            curl -fsSL --retry 3 -o rel.bin "$1"
            GOT=$(sha256sum rel.bin | awk '{print $1}')
            TAM=$(stat -c %s rel.bin)
            echo "  sha256=$GOT"
            echo "  tamanho=$TAM"
            if [ "$GOT" = "$2" ]; then
              echo "  OK $3"
              ok=$((ok+1))
            else
              echo "  FALHOU: sha divergente do pino"
              exit 1
            fi
            rm -f rel.bin
          }

          check "$BASE/models/hymt2/Hy-MT2-1.8B-Q4_K_M.gguf" \
            "dc5f44fcf1fa496ee7ad725982c0c8c553a4de00259b53af84c4b89fb0c06699" "Q4_K_M"
          check "$BASE/models/hymt2/Hy-MT2-1.8B-Q6_K.gguf" \
            "d98fe604dec1f28f58f80d7d560f7177e584d3b8e5835862687660e5ff97cb40" "Q6_K"
          check "$BASE/models/hymt2/Hy-MT2-1.8B-1.25Bit.gguf" \
            "cc497fe8f033b52b3b8b00a7669e9661435432f9d4cd43f7ed24400c01507a93" "1.25bit"
          check "$BASE/models/whisper/ggml-silero-v6.2.0.bin" \
            "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987" "silero VAD"

          echo "TODOS OS $ok/4 OBJETOS CONFERIDOS COM SHA-256 COMPLETO"
