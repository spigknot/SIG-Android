name: SIG validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # JDK 21 via temurin (API adoptium estavel). O critério de toolchain
          # do repositorio (gradle-daemon-jvm.properties, toolchainVendor=
          # JETBRAINS) e neutralizado no step seguinte SO no runner: o resolver
          # foojay esta com link expirado (HTTP 400) e a API deles aplica rate
          # limit no IP compartilhado (runs 37650685773 / 37651278251).
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Neutraliza criterio de daemon do CI (usa o JDK 21 do runner)
        shell: pwsh
        run: |
          # Remove o criterio SO no runner (arquivo segue versionado local).
          Remove-Item gradle/gradle-daemon-jvm.properties -Force -ErrorAction SilentlyContinue
          Write-Output "criterio de daemon removido no CI; java -version:"
          java -version

      - name: Validate harness contracts
        shell: pwsh
        run: |
          & .\scripts\tests\validate-agent-harness.tests.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Android gates
        shell: pwsh
        run: |
          & .\scripts\validate-agent-harness.ps1 -RunAndroidGates -Quiet -Json -EvidencePath build\harness-validation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload bounded validation evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sig-validation-evidence
          path: build/harness-validation.json
          if-no-files-found: warn
